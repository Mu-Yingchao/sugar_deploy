[project]
name = "sugar_deploy"
version = "0.1.0"
description = "SUGAR Command Tracker + Command Generator 的 MuJoCo sim2sim / 真机部署"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0.0",
    "tyro>=0.8.0",
    "numpy",
    "torch",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sugar_deploy*"]

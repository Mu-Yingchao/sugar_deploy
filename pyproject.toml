[project]
name = "sugar_deploy"
version = "0.1.0"
description = "SUGAR Command Tracker + Command Generator 的 MuJoCo sim2sim / 真机部署"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0.0",
    "tyro>=0.8.0",
    "numpy",
    "torch",
    "pupil-apriltags>=1.0.4",
    "pillow",
]

[project.optional-dependencies]
# 真机 RealSense 相机用；sim2sim 里 MujocoCameraSource 不需要这个，
# 只有跑 AprilTagObjectSource + RealSenseCameraSource（真机）才要装。
# 单独拆出来是因为 pyrealsense2 依赖真实相机 SDK，在没有相机的开发机/CI 上装了也用不了，
# 不装也不该影响 sim2sim 这条主链路能不能跑起来。
realsense = [
    "pyrealsense2",
]
# 真机低层控制用（real_robot_io.py）；装之前先看 REAL_HARDWARE_DEPLOYMENT.md 的 FAQ——
# unitree_sdk2py 依赖编译好的 cyclonedds，直接 pip install 大概率会因为找不到
# CYCLONEDDS_HOME 失败，需要先手动编译一遍 cyclonedds。同样是可选依赖，不该影响 sim2sim
# 主链路。
unitree = [
    "unitree_sdk2py @ git+https://github.com/unitreerobotics/unitree_sdk2_python.git",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sugar_deploy*"]
